name: zaix
version: 2.0.0+2
publish_to: none
description: "ZAI-X"
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies: 
  # Icons
  remixicon: ^4.9.3

  # Framework and utilities
  get: ^4.7.3
  dio: ^5.11.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  crypton: ^2.2.1
  crypto: ^3.0.7
  logger: ^2.7.0
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  # flutter_localizations in Flutter 3.44.8 pins intl to 0.20.2.
  intl: ^0.20.2
  collection: ^1.19.1
  path: ^1.9.1
  universal_html: ^2.3.0
  html_unescape: ^2.0.0

  # Widgets
  flutter_smart_dialog: ^5.1.1
  flutter_staggered_grid_view: ^0.7.0
  multi_split_view: ^3.6.2
  extended_image: ^10.1.0
  easy_refresh: ^3.5.1
  lottie: ^3.5.1
  photo_view: ^0.15.0
  scrollable_positioned_list: ^0.3.8

  # Platform integration
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  flutter_widget_from_html_core: ^0.17.2
  share_plus: ^13.3.0
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  saver_gallery: ^5.1.0
  connectivity_plus: ^7.3.1
  battery_plus: ^7.1.1
  file_selector: ^1.1.0
  windows_single_instance: ^1.2.0
  
  flutter: 
    sdk: flutter
  flutter_localizations: 
    sdk: flutter
  
dev_dependencies: 
  flutter_lints: ^6.0.0
  # 2.15.2+ requires analyzer 13.3, while hive_ce_generator 1.11.2 uses analyzer 12.
  build_runner: 2.15.1
  hive_ce_generator: ^1.11.2
  msix: ^3.18.0
  flutter_test: 
    sdk: flutter

# jni 1.0.1 requires AGP 9 built-in Kotlin, while Flutter 3.44.8 still requires
# its legacy Kotlin compatibility mode. Remove this override with the two
# compatibility switches in android/gradle.properties.
dependency_overrides:
  jni: 1.0.0

flutter:
  uses-material-design: true
  assets: 
    - assets/lotties/
    - assets/images/
    - assets/statement.txt


