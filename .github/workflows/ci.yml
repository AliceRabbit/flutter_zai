name: CI

on:
  push:
    branches:
      - main
    tags:
      - "zaix/*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-android:
    name: Analyze, test, and build Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read Flutter version
        id: flutter-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Regenerate Hive adapters
        run: dart run build_runner build

      - name: Verify generated Hive sources
        run: git diff --exit-code -- lib/hive_registrar.g.dart lib/models/db

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage --test-randomize-ordering-seed random

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  build-windows:
    name: Build Windows
    needs: analyze-test-android
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read Flutter version
        id: flutter-version
        shell: pwsh
        run: '"version=$((Get-Content -Raw .flutter-version).Trim())" >> $env:GITHUB_OUTPUT'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows debug app
        run: flutter build windows --debug

  build-linux:
    name: Build Linux
    needs: analyze-test-android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read Flutter version
        id: flutter-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux debug app
        run: flutter build linux --debug

  build-apple:
    name: Build iOS and macOS
    needs: analyze-test-android
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read Flutter version
        id: flutter-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned iOS debug app
        run: flutter build ios --debug --no-codesign

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS debug app
        run: flutter build macos --debug

      - name: Verify SwiftPM-only Apple integration
        shell: bash
        run: |
          if [[ -e ios/Podfile.lock || -e macos/Podfile.lock ]]; then
            echo "A CocoaPods lockfile was generated; all native plugins must use SwiftPM."
            exit 1
          fi
          git diff --exit-code -- ios macos
