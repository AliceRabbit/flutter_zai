name: zaix-app-build-action
#推送Tag时触发
on:
  push:
    tags:
      - "zaix/*"
jobs:
  # Android 镜像
  build-android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # 1.1 签出代码
      - uses: actions/checkout@v4
      # 1.2 写出相关签名
      - name: Get Android Keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.ZAI_KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > android/zai_key.properties
          echo "storePassword=${{ secrets.ZAI_STORE_PASSWORD }}" >> android/zai_key.properties
          echo "keyPassword=${{ secrets.ZAI_KEY_PASSWORD }}" >> android/zai_key.properties
          echo "keyAlias=${{ secrets.ZAI_KEY_ALIAS }}" >> android/zai_key.properties
      # 1.2 设置JAVA环境
      - name: Setup JAVA
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      # 1.3 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true
      # 1.4 更新Flutter的packages
      - name: Restore Packages
        run: flutter pub get --enforce-lockfile
      # 1.5 build APK
      - name: Build APK
        run: flutter build apk --release
      # 1.6 上传APK
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: document/RELEASE.txt
          token: ${{ github.token }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        #完成
      - run: echo "Android job's status is ${{ job.status }}."
  # Windows 镜像
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 3.1 签出代码
      - uses: actions/checkout@v4
      # 3.2 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      - name: Restore Packages
        run: flutter pub get --enforce-lockfile
      # 3.3 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      # 3.4 build Windows ZIP\MSIX
      - name: Build Windows
        run: flutter_distributor package --platform windows --targets msix,zip --skip-clean
      # 3.5 上传ZIP\MSIX
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: document/RELEASE.txt
          token: ${{ github.token }}
          files: |
            build/dist/*/*.msix
            build/dist/*/*.zip
        #完成
      - run: echo "Windows job's status is ${{ job.status }}."
